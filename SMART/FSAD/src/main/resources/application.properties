spring.application.name=event-management

# =====================================================
# MySQL / XAMPP Database Configuration
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/campus_events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate properties
# 'update' keeps your data safe between restarts (never drops tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logout redirect
spring.security.logout.success-url=/

# Multipart config
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Server port
server.port=8080
