<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register for Event')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>

    <main class="container">
        <div class="form-container glass animate-in">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; color: var(--primary);">Secure Your Seat</h1>
                <p style="color: var(--text-muted);" th:text="${event.title}">For: Event Title</p>
            </div>

            <div th:if="${error}" class="glass" style="padding: 1rem; margin-bottom: 1.5rem; border-left: 4px solid #ef4444; color: #dc2626; font-size: 0.9rem;">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error message</span>
            </div>

            <!-- Event Location Map (Innovation Module) -->
            <div th:if="${event.latitude != null && event.longitude != null}" style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Event Location on Campus Map</label>
                <div id="event-map" style="height: 250px; width: 100%; border-radius: 0.5rem; border: 1px solid var(--border-color);"></div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; text-align: center;">
                    <i class="fas fa-map-marker-alt"></i> <span th:text="${event.location}">Location</span>
                </p>
                <!-- Leaflet CSS and JS -->
                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
                <script th:inline="javascript">
                    document.addEventListener('DOMContentLoaded', function() {
                        /*<![CDATA[*/
                        var lat = /*[[${event.latitude}]]*/ null;
                        var lng = /*[[${event.longitude}]]*/ null;
                        var title = /*[[${event.title}]]*/ 'Event';
                        var loc = /*[[${event.location}]]*/ 'Location';
                        /*]]>*/

                        if(lat && lng) {
                            var map = L.map('event-map').setView([lat, lng], 16);
                            
                            // Classic Esri Map Tiles
                            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                                attribution: '&copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
                            }).addTo(map);

                            // Classic red marker
                            var classicIcon = L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowSize: [41, 41]
                            });

                            var marker = L.marker([lat, lng], {icon: classicIcon}).addTo(map);
                            marker.bindPopup('<b style="color: black;">' + title + '</b><br><span style="color: gray;">' + loc + '</span>').openPopup();
                        }
                    });
                </script>
            </div>

            <form th:action="@{/register}" th:object="${registration}" method="post">
                <input type="hidden" th:field="*{event.id}">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{studentName}" class="form-control" placeholder="John Doe">
                    <div th:if="${#fields.hasErrors('studentName')}" th:errors="*{studentName}" class="error-text"></div>
                </div>

                <div class="form-group">
                    <label>University Email</label>
                    <input type="email" th:field="*{studentEmail}" class="form-control" placeholder="john.doe@university.edu">
                    <div th:if="${#fields.hasErrors('studentEmail')}" th:errors="*{studentEmail}" class="error-text"></div>
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" th:field="*{studentId}" class="form-control" placeholder="U12345678">
                    <div th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}" class="error-text"></div>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" th:field="*{department}" class="form-control" placeholder="Computer Science">
                    <div th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error-text"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem; font-size: 1.1rem;">
                    Confirm Registration
                </button>
                
                <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                    By registering, you agree to receive event-related notifications.
                </p>
            </form>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
