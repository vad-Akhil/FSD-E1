<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign Up - Smart Campus')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>

    <main class="container">
        <div class="form-container glass animate-in" style="max-width: 500px; margin-top: 4rem; margin-bottom: 4rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: white; font-size: 1.5rem;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p style="color: var(--text-muted);">Join the Smart Campus community</p>
            </div>

            <form th:action="@{/signup}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="johndoe123" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@university.edu" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" th:field="*{studentId}" class="form-control" placeholder="ST12345" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" th:field="*{department}" class="form-control" placeholder="Computer Science" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
                    Create Account
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a th:href="@{/login}" style="color: var(--primary); font-weight: 600;">Sign In</a>
            </p>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
