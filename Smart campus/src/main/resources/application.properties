spring.application.name=event-management
server.port=8080

# Database Configuration (MySQL XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/campus_events?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Default Security Configuration (Admin Login)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN
