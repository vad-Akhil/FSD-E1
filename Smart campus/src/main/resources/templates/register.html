<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register for Event</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <a href="/" class="logo">SmartCampus Events</a>
        <nav>
            <a href="/">Browse Events</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px;">
        <h1 class="page-title">Event Registration</h1>
        
        <div class="glass-card" style="margin-bottom: 2rem; background: rgba(30, 41, 59, 0.4);">
            <h3 th:text="${event.title}">Event Title</h3>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;" th:text="${event.eventDate} + ' | ' + ${event.department} + ' | ' + ${event.eventType}"></p>
        </div>

        <div class="glass-card">
            <form th:action="@{/events/{id}/register(id=${event.id})}" th:object="${student}" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="John Doe" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-text"></span>
                </div>
                
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="student@university.edu" />
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
                </div>
                
                <div style="margin-top: 2rem; display: flex; justify-content: space-between;">
                    <a href="/" class="btn" style="background: transparent; color: var(--text-secondary);">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="width: 200px;">Confirm Registration</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
