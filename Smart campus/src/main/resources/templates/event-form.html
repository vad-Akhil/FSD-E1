<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Form - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <a href="/" class="logo">SmartCampus Events</a>
        <nav>
            <a href="/admin/dashboard" style="margin-right: 1.5rem;">Dashboard</a>
            <span style="color: var(--accent); font-weight: 600;">Admin Panel</span>
        </nav>
    </header>

    <div class="container" style="max-width: 800px;">
        <h1 class="page-title" th:text="${event.id == null ? 'Create New Event' : 'Edit Event'}">Create Event</h1>
        
        <div class="glass-card">
            <form th:action="${event.id == null ? '/admin/events/new' : '/admin/events/' + event.id + '/edit'}" th:object="${event}" method="post">
                <div class="form-group">
                    <label for="title">Event Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" />
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-text"></span>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="eventDate">Event Date</label>
                        <input type="date" id="eventDate" th:field="*{eventDate}" class="form-control" />
                        <span th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="maxCapacity">Maximum Capacity</label>
                        <input type="number" id="maxCapacity" th:field="*{maxCapacity}" class="form-control" />
                        <span th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}" class="error-text"></span>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science" />
                        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventType">Event Type</label>
                        <input type="text" id="eventType" th:field="*{eventType}" class="form-control" placeholder="e.g. Seminar, Workshop" />
                        <span th:if="${#fields.hasErrors('eventType')}" th:errors="*{eventType}" class="error-text"></span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-text"></span>
                </div>
                
                <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a href="/admin/dashboard" class="btn" style="background: transparent; color: var(--text-secondary);">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="width: 150px;">Save Event</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
